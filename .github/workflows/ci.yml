name: PR8 native link comparison (not qualification)
on:
  push:
    branches: [diagnose/pr8-native-startup-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: 2
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      RCH_GIT_COMMIT: 0c8025f69848682228346f3068e57aa35446465a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-${{ hashFiles('Cargo.toml') }}
          shared-key: pr8-native-link-comparison
          cache-on-failure: true
      - name: Build both real CLI variants without changing source or TLS
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          # Exact same deployment target, source and release profile in both
          # arms. This experimental macOS12 floor is NOT yet adopted by PR8.
          git diff 0c8025f69848682228346f3068e57aa35446465a --exit-code -- Cargo.toml Cargo.lock rch rch-common rch-telemetry
          cargo rustc --locked --release -p rch --bin rch -- -C link-arg=-Wl,-no_fixup_chains
          cp target/release/rch evidence/rch-legacy
          cargo rustc --locked --release -p rch --bin rch -- -C link-arg=-Wl,-fixup_chains
          cp target/release/rch evidence/rch-chains
          for name in legacy chains; do
            evidence/rch-$name --version
            otool -l evidence/rch-$name > evidence/$name-load-commands.txt
            otool -L evidence/rch-$name > evidence/$name-libraries.txt
            size -m evidence/rch-$name > evidence/$name-segments.txt
            codesign -dvv evidence/rch-$name > evidence/$name-signature.txt 2>&1
          done
          grep -q LC_DYLD_CHAINED_FIXUPS evidence/chains-load-commands.txt
          if grep -q LC_DYLD_CHAINED_FIXUPS evidence/legacy-load-commands.txt; then exit 1; fi
      - name: Paired startup and observable-behavior comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, resource, statistics, subprocess, time
          p = pathlib.Path('evidence')
          binaries = {name: str((p/('rch-'+name)).resolve()) for name in ('legacy','chains')}
          report = {'source': '0c8025f69848682228346f3068e57aa35446465a', 'deployment_target': '12.0', 'cpu_count': os.cpu_count(), 'load': os.getloadavg(), 'sha256': {name:hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() for name,path in binaries.items()}, 'rounds': []}
          inputs = [('empty', b''), ('read', b'{"tool_name":"Read","tool_input":{"command":"x"}}\n'), ('echo', b'{"tool_name":"Bash","tool_input":{"command":"echo test"}}\n'), ('git', b'{"tool_name":"Bash","tool_input":{"command":"git status"}}\n')]
          # Three predetermined rounds, fifty interleaved processes per arm and
          # input, all samples retained. No warmup exclusion or best-run choice.
          for turn in range(3):
              for label,data in inputs:
                  samples = {name:[] for name in binaries}
                  cpu = {name:0.0 for name in binaries}
                  for number in range(50):
                      order = ('legacy','chains') if (number+turn)%2==0 else ('chains','legacy')
                      observed = []
                      for name in order:
                          before = resource.getrusage(resource.RUSAGE_CHILDREN)
                          started = time.perf_counter_ns()
                          result = subprocess.run([binaries[name]],input=data,capture_output=True,check=True)
                          samples[name].append(time.perf_counter_ns()-started)
                          after = resource.getrusage(resource.RUSAGE_CHILDREN)
                          cpu[name] += after.ru_utime+after.ru_stime-before.ru_utime-before.ru_stime
                          observed.append((result.returncode,result.stdout,result.stderr))
                      assert observed[0] == observed[1] == (0,b'',b''), (label,observed)
                  for name in binaries:
                      row={'round':turn,'input':label,'variant':name,'mean_ms':statistics.mean(samples[name])/1e6,'median_ms':statistics.median(samples[name])/1e6,'samples_ns':samples[name],'child_cpu':cpu[name]}
                      report['rounds'].append(row)
                      print({k:v for k,v in row.items() if k!='samples_ns'},flush=True)
          for arguments in (['--version'],['--capabilities'],['--help-json'],['--help'],['not-a-valid-subcommand']):
              values=[subprocess.run([binary,*arguments],capture_output=True) for binary in binaries.values()]
              assert values[0].returncode==values[1].returncode
              # Executable names in help/errors naturally differ; preserve the
              # machine-readable contracts exactly and check failures stay so.
              if arguments[0] in ('--version','--capabilities','--help-json'):
                  assert (values[0].stdout,values[0].stderr)==(values[1].stdout,values[1].stderr)
          (p/'comparison.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr8-native-link-comparison
          path: |
            evidence/*.json
            evidence/*.txt
          if-no-files-found: error
          retention-days: 7
