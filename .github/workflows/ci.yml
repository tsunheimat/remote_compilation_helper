name: PR8 native startup diagnosis (not qualification)
on:
  push:
    branches: [diagnose/pr8-native-startup-20261101]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain and verify the exact previously tested native release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          gh api repos/tsunheimat/remote_compilation_helper/actions/artifacts/12974625219/zip > evidence/application.zip
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          p = pathlib.Path('evidence')
          assert hashlib.sha256((p/'application.zip').read_bytes()).hexdigest() == '7168983b1e552aa49809d97e4b7948bca0df101e715bc6e8f884a69776d2f476'
          with zipfile.ZipFile(p/'application.zip') as archive:
              assert set(archive.namelist()) == {'component.json', 'rch', 'rchd', 'rch-wkr'}
              parts = p/'parts'
              parts.mkdir()
              for name in archive.namelist():
                  (parts/name).write_bytes(archive.read(name))
          receipt = json.loads((parts/'component.json').read_text())
          assert receipt['source'] == 'b30995825be82fd53ab5170d1d44b149a0965637'
          assert receipt['target'] == 'aarch64-apple-darwin'
          print(json.dumps(receipt, indent=2))
          PY
          python3 -I scripts/package_ci_components.py restore-e2e --parts evidence/parts --output evidence/bin --source b30995825be82fd53ab5170d1d44b149a0965637 --target aarch64-apple-darwin
          evidence/bin/rch --version
          otool -L evidence/bin/rch > evidence/linked-libraries.txt
          size -m evidence/bin/rch > evidence/segments.txt
          codesign -dvv evidence/bin/rch > evidence/signature.txt 2>&1
      - name: Measure unchanged hook inputs and process-launch controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, platform, resource, statistics, subprocess, sys, time
          p = pathlib.Path('evidence')
          binary = str((p/'bin/rch').resolve())
          variants = [('empty', [binary], b''), ('read', [binary], b'{"tool_name":"Read","tool_input":{"command":"ignored"}}\n'), ('echo', [binary], b'{"tool_name":"Bash","tool_input":{"command":"echo test"}}\n'), ('git', [binary], b'{"tool_name":"Bash","tool_input":{"command":"git status"}}\n'), ('system-true', ['/usr/bin/true'], b'{"tool_name":"Bash","tool_input":{"command":"echo test"}}\n')]
          report = {'python': sys.version, 'platform': platform.platform(), 'cpus': os.cpu_count(), 'load': os.getloadavg(), 'rounds': []}
          # Three predeclared rounds, 50 processes each, alternating ordering.
          # No best-round selection, warmup exclusion, timing waiver or source change.
          for turn in range(3):
              for name, command, data in variants[::1 if turn % 2 == 0 else -1]:
                  samples = []
                  before = resource.getrusage(resource.RUSAGE_CHILDREN)
                  for _ in range(50):
                      start = time.perf_counter_ns()
                      result = subprocess.run(command, input=data, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, check=True)
                      samples.append(time.perf_counter_ns() - start)
                      assert not result.stderr, (name, result.stderr)
                  after = resource.getrusage(resource.RUSAGE_CHILDREN)
                  row = {'round': turn, 'input': name, 'mean_ms': statistics.mean(samples)/1e6, 'median_ms': statistics.median(samples)/1e6, 'samples_ns': samples, 'child_user': after.ru_utime-before.ru_utime, 'child_system': after.ru_stime-before.ru_stime}
                  report['rounds'].append(row)
                  print({k:v for k,v in row.items() if k != 'samples_ns'}, flush=True)
          (p/'timing.json').write_text(json.dumps(report, indent=2))
          data = variants[2][2]
          for label, flags in [('dyld-statistics', {'DYLD_PRINT_STATISTICS':'1', 'DYLD_PRINT_STATISTICS_DETAILS':'1'}), ('dyld-libraries', {'DYLD_PRINT_LIBRARIES':'1'})]:
              result = subprocess.run([binary], input=data, capture_output=True, env=dict(os.environ, **flags))
              (p/(label+'.stdout')).write_bytes(result.stdout)
              (p/(label+'.stderr')).write_bytes(result.stderr)
              print(label, result.returncode, result.stderr.decode(errors='replace'), flush=True)
              assert result.returncode == 0 and not result.stdout
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr8-native-startup-diagnosis
          path: |
            evidence/*.json
            evidence/*.txt
            evidence/*.stdout
            evidence/*.stderr
          if-no-files-found: error
          retention-days: 7
