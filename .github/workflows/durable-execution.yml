name: Durable execution recovery

# Validate the committed source, never apply historical candidate blobs or
# grant a CI process permission to publish a repair directly to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rch/src/transfer.rs'
      - 'rch/src/hook/source_claim_registry.sh'
      - 'rch-common/src/stale_target_reap.rs'
      - 'scripts/tests/test_durable_execution.py'
      - 'scripts/test_source_claim_registry.py'
      - 'scripts/tests/test_source_claim_registry.py'
      - 'rust-toolchain.toml'
      - '.github/workflows/durable-execution.yml'

permissions:
  contents: read

concurrency:
  group: durable-execution-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: nightly-2026-08-31
  CARGO_BUILD_JOBS: 2
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  supervisor-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Compile the actual formatter and exercise owned processes
        run: python3 scripts/tests/test_durable_execution.py --native
      - name: Exercise source registry exclusion and recovery on committed HEAD
        # Retained from the removed one-shot source-admission workflow.
        if: success() || failure()
        run: |
          sh -n rch/src/hook/source_claim_registry.sh
          python3 scripts/test_source_claim_registry.py -v
      - name: Exercise source registry compatibility and overlap
        if: success() || failure()
        run: python3 scripts/tests/test_source_claim_registry.py -v
