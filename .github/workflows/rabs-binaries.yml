# S7 (bead bd-n8qt3): release builds of the three RABS spine binaries.
# The tiny wrapper (rabs-wrap) and the daemons (rabsd, rabs-wkr) must
# always build in release — the A021 split-profile discipline and the
# C010 overhead gate both assume the shipped artifact is release-built.
# This workflow proves they compile, and runs the doctor + wrapper
# overhead gates that only mean anything in release.
name: RABS Binaries

on:
  push:
    branches: [main]
    paths:
      - 'rabs*/**'
      - 'rch*/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/rabs-binaries.yml'
  pull_request:
    paths:
      - 'rabs*/**'
      - 'rch*/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/rabs-binaries.yml'
  workflow_dispatch:

concurrency:
  group: rabs-binaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_BUILD_JOBS: 2

jobs:
  installation:
    name: complete RABS installation (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Native filesystem, process, archive and upgrade regressions
        run: python3 -m unittest discover -s tests -p 'test_install_rabs*.py' -v
      - name: SPRT native SQL and boundary model (not a Rust execution proof)
        run: python3 -m unittest discover -s tests -p test_rabs_sprt_evidence.py -v
      - name: Worker-local RABS bridge and managed launcher regressions
        run: |
          python3 scripts/tests/test_cargo_rabs.py -v
          python3 tests/test_rabs_worker_cache.py -v
          python3 tests/test_rabs_worker_cache_diagnostics.py -v
      - name: Canonical Cargo frontend (native driver is an explicit fixture)
        run: python3 -I -S scripts/tests/test_cargo_rabs_canonical.py -v
      - name: Capture recovery SQL and interruption model (not a Rust execution proof)
        run: python3 tests/test_rabs_capture_recovery.py -v
      - name: Indexed evidence queries (native SQLite, not Rust execution)
        run: python3 tests/test_rabs_evidence_queries.py -v

  # Wrapper unit/live_protocol tests and their Clippy/fmt checks are already
  # in ci.yml's full-workspace graph. Keep the distinct release-only gates here.
  build:
    name: release build + gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      # Two concurrent release rustc processes nearly exhausted RAM and swap
      # before a shutdown. Serialize compilation; retain every gate.
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-${{ hashFiles('Cargo.toml') }}
          shared-key: rabs-release-gates
          cache-on-failure: true
      - name: Install bubblewrap (worker capability + sandbox tests)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Release build the three spine binaries
        shell: bash
        run: |
          set -euo pipefail
          # A runner shutdown can prevent even an always() follow-up step.
          # Emit resource observations during the unchanged build command.
          python3 -u - <<'PY' &
          import datetime
          import json
          import pathlib
          import time

          def read(path):
              try:
                  return pathlib.Path(path).read_text()
              except OSError:
                  return None

          while True:
              meminfo = read('/proc/meminfo') or ''
              memory = {line.split(':', 1)[0]: line.split(':', 1)[1].strip()
                        for line in meminfo.splitlines()
                        if line.startswith(('MemTotal:', 'MemAvailable:', 'SwapTotal:', 'SwapFree:'))}
              processes = []
              for entry in pathlib.Path('/proc').iterdir():
                  if not entry.name.isdecimal():
                      continue
                  fields = dict(line.split(':', 1) for line in (read(entry / 'status') or '').splitlines()
                                if ':' in line)
                  rss = int(fields.get('VmRSS', '0 kB').split()[0])
                  if rss:
                      processes.append({'pid': int(entry.name), 'name': fields.get('Name', '').strip(),
                                        'rss_kib': rss, 'threads': fields.get('Threads', '').strip()})
              cgroup = read('/proc/self/cgroup') or ''
              relative = next((line.split('::', 1)[1] for line in cgroup.splitlines()
                               if line.startswith('0::')), '/')
              cgroup_root = pathlib.Path('/sys/fs/cgroup') / relative.lstrip('/')
              print('RABS runner resources ' + json.dumps({
                  'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'memory': memory, 'self_cgroup': cgroup,
                  'cgroup': {name: read(cgroup_root / name) for name in
                             ('memory.current', 'memory.max', 'memory.peak', 'memory.events', 'cpu.max')},
                  'host_oom_kill': next((line for line in (read('/proc/vmstat') or '').splitlines()
                                         if line.startswith('oom_kill ')), None),
                  'largest_processes': sorted(processes, key=lambda row: row['rss_kib'], reverse=True)[:8]
              }), flush=True)
              time.sleep(30)
          PY
          rabs_sampler_pid=$!
          trap 'rabs_build_status=$?; trap - EXIT; kill "$rabs_sampler_pid" 2>/dev/null || true; wait "$rabs_sampler_pid" 2>/dev/null || true; exit "$rabs_build_status"' EXIT
          cargo build --release -p rabsd -p rabs-wrap -p rabs-wkr
      - name: Worker-cache command assembly and opt-out parity
        run: cargo test --release -p rch-common --lib toolchain::worker_cache --locked
      - name: Coherent preparation to native worker-build handoff
        run: cargo test --release -p rabsd --bin rabsd worker_exec::prepared_build --locked
      - name: Binary size budget (rabs-wrap < 2 MiB, A021)
        run: |
          size=$(stat -c%s target/release/rabs-wrap)
          echo "rabs-wrap release size: $size bytes"
          test "$size" -lt 2097152
      - name: Worker diagnostic custody through real pipes and retained readers
        run: |
          cargo test --release -p rabs-asupersync --lib stream_drain --locked
          cargo test --release -p rabs-wkr --lib output::tests --locked
          cargo test --release -p rabs-wkr --lib session::tests --locked
      - name: Durable replay allowance and real compiler verification
        run: |
          cargo test --release -p rabs-cas --lib serving_sample_gate --locked
          cargo test --release -p rabs-cas --lib materialization::staged --locked
          cargo test --release -p rabs-cas --lib read_indexes --locked
          cargo test --release -p rabs-cas --lib trust_evidence --locked
          cargo test --release -p rabsd --lib coord::live:: --locked
          cargo test --release -p rabsd --test live_replay --test live_class_safety --test live_sprt_budget --test complete_output_serving --no-fail-fast --locked
          cargo test --release -p rabsd --lib edge::server --locked
          cargo test --release -p rabs-wrap --test live_dependency_e2e --locked
      - name: Shared endpoint ownership and restart fences
        run: cargo test --release -p rabs-sandbox --lib socket_endpoint --locked
      - name: Recurring CAS maintenance and physical reclaim
        run: |
          cargo test --release -p rabsd --lib janitor --locked
          cargo test --release -p rabsd --test janitor_gc_live --test janitor_reclaim_live --locked
      - name: Compiler capture custody and durable restart recovery
        run: |
          cargo test --release -p rabs-cas --lib blob_store --locked
          cargo test --release -p rabsd --lib output_capture --locked
          cargo test --release -p rabsd --lib capture_pins --locked
          cargo test --release -p rabsd --lib edge::live_facts::package_capture --locked
      - name: Toolchain ownership and complete live input observations
        run: cargo test --release -p rabsd --lib edge::live_facts --locked
      - name: Cargo layout projection keys and real split-directory builds
        shell: bash
        run: |
          set -euo pipefail
          placement_tests=(cargo test --release -p rabsd --lib cargo_placement::tests --locked)
          listed_tests=$("${placement_tests[@]}" -- --list)
          printf '%s\n' "$listed_tests"
          if ! grep -q ': test$' <<< "$listed_tests"; then
            echo '::error::Cargo placement selector matched no tests' >&2
            exit 1
          fi
          "${placement_tests[@]}"
          cargo test --release -p rabs-wrap --test live_cargo_layout --locked -- --nocapture
      - name: Real Cargo worktrees receive served dependencies (M4)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/test-logs/rabs-release
          cargo test --release -p rabs-wrap --test live_cargo_worktrees --locked -- --nocapture 2>&1 | tee target/test-logs/rabs-release/live-cargo-worktrees.log
      - name: Doctor + wrapper overhead gate (release, enforcing)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/test-logs/rabs-release
          cargo test --release -p rabsd --test doctor_live 2>&1 | tee target/test-logs/rabs-release/doctor-live.log
          cargo test --release -p rabs-wrap --test overhead_live -- --nocapture 2>&1 | tee target/test-logs/rabs-release/overhead-live.log
      - name: Retain the release-gate evidence independently of the full job log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rabs-release-gates-${{ github.sha }}
          path: target/test-logs/rabs-release/
          if-no-files-found: warn
          retention-days: 7
