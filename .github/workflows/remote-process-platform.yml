name: Remote process platform identity

on:
  pull_request:
    paths:
      - 'rch-common/src/process_identity.rs'
      - 'rch-common/src/remote_process.sh'
      - 'rch-common/src/remote_scoped_launch.rs'
      - 'rch-common/src/remote_scoped_launch.sh'
      - 'rch-common/tests/remote_supervised_platform.py'
      - 'rch-common/tests/remote_process_platform.py'
      - 'rch-common/tests/remote_control_timeout.py'
      - 'rch-wkr/src/main.rs'
      - 'rch/src/transfer.rs'
      - '.github/workflows/remote-process-platform.yml'
  push:
    branches: [main]
    paths:
      - 'rch-common/src/process_identity.rs'
      - 'rch-common/src/remote_process.sh'
      - 'rch-common/src/remote_scoped_launch.rs'
      - 'rch-common/src/remote_scoped_launch.sh'
      - 'rch-common/tests/remote_supervised_platform.py'
      - 'rch-common/tests/remote_process_platform.py'
      - 'rch-common/tests/remote_control_timeout.py'
      - 'rch-wkr/src/main.rs'
      - 'rch/src/transfer.rs'
      - '.github/workflows/remote-process-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-process-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: nightly-2026-08-31
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_BUILD_JOBS: 2

jobs:
  native-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Compile native worker identity helper
        run: cargo build --locked -p rch-wkr
      - name: Exercise actual identity and full shell lifecycle
        run: |
          export PATH="$PWD/target/debug:$PATH"
          python3 rch-common/tests/remote_process_platform.py
          RCH_TEST_SHELL=/bin/bash python3 rch-common/tests/remote_process_platform.py
      - name: Exercise bounded probes and lifecycle without GNU timeout
        run: |
          export PATH="$PWD/target/debug:$PATH"
          python3 rch-common/tests/remote_control_timeout.py -v
          RCH_TEST_SHELL=/bin/bash python3 rch-common/tests/remote_control_timeout.py -v
      - name: Exercise the production owned-group supervisor on each platform
        env:
          # Preserve actual failed exchange status and process-only census data;
          # observing a failure does not turn it into successful cleanup.
          RCH_TEST_EVIDENCE_ROOT: ${{ runner.temp }}/rch-native-observations
        run: |
          export PATH="$PWD/target/debug:$PATH"
          for shell in /bin/sh /bin/bash; do
            RCH_TEST_SHELL="$shell" python3 rch-common/tests/remote_supervised_platform.py -v
            RCH_TEST_NO_TIMEOUT=1 RCH_TEST_SHELL="$shell" python3 rch-common/tests/remote_supervised_platform.py -v
          done
      - name: Check shared native identity and Linux escalation
        run: |
          cargo test --locked -p rch-common process_identity
          cargo test --locked -p rch-common --test remote_process_escalation
      - name: Retain owned native-observer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-observations-${{ matrix.os }}
          # Select data files only. Do not follow the fixture bin/ symlinks or
          # collect unrelated host files, toolchains or environment secrets.
          path: |
            ${{ runner.temp }}/rch-native-observations/**/case.json
            ${{ runner.temp }}/rch-native-observations/**/observations.log
            ${{ runner.temp }}/rch-native-observations/**/err-*
            ${{ runner.temp }}/rch-native-observations/**/receipt
            ${{ runner.temp }}/rch-native-observations/**/signals
            ${{ runner.temp }}/rch-native-observations/**/signal-outcomes
          if-no-files-found: warn
          retention-days: 7
      # Full-workspace compilation, Clippy and formatting belong to ci.yml;
      # this lane owns the distinct native shell/process identity checks.
