name: Wrapper Contract Matrix

# PR workspace tests already install and exercise all three Rust channels.
# This independent weekly probe detects external channel drift without a code
# change. One harness build compares all channels; none is silently skipped.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: wrapper-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_BUILD_JOBS: 2
  RUSTUP_TOOLCHAIN: nightly-2026-08-31

jobs:
  contract:
    name: contract (stable, beta, nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-${{ hashFiles('Cargo.toml') }}
          shared-key: wrapper-contract
          cache-on-failure: true
      - name: Install every channel under test
        run: |
          for channel in stable beta nightly; do
            rustup toolchain install "$channel" --profile minimal --no-self-update
          done
      - name: Compare live wrapper contracts against their recorded fixtures
        env:
          RABS_CONTRACT_CHANNELS: stable,beta,nightly
        run: cargo test --locked -p rabsd --test wrapper_contract -- --nocapture
