name: Source-content SSH integrity

on:
  push:
    branches: [main]
    paths:
      - 'rch/src/transfer.rs'
      - 'rch/src/hook/ssh.rs'
      - 'rch/src/transfer/source_content_barrier.rs'
      - 'rabs-scheduler/src/managed_pool.rs'
      - 'scripts/test_source_content_ssh.py'
      - '.github/workflows/source-content-ssh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-content-ssh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ssh-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: stable
      RSYNC_OLD_ARGS: '0'
      RSYNC_PROTECT_ARGS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native regression tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rsync openssh-client openssh-server
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check receipt transport formatting
        run: |
          set -euo pipefail
          rustfmt --check --edition 2024 --config skip_children=true rch/src/transfer.rs rch/src/hook/ssh.rs rch/src/transfer/source_content_barrier.rs rabs-scheduler/src/managed_pool.rs
          git diff --check
      - name: Test exact Rust policy with real SSH and rsync
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source84-evidence"
          python3 scripts/test_source_content_ssh.py --evidence "$RUNNER_TEMP/source84-evidence" 2>&1 | tee "$RUNNER_TEMP/source84-evidence/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-content-ssh-${{ github.sha }}
          path: ${{ runner.temp }}/source84-evidence
          if-no-files-found: warn
          retention-days: 7
