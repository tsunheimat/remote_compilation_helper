name: e2e

# Builds the application binaries once per OS and runs every scripts/e2e_*.sh through
# the shared runner, uploads each script's JSONL + build log, and aggregates a PASS/FAIL
# summary posted as a PR comment (remote_compilation_helper-62u24.15).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Bound peak compiler memory on hosted VMs.
  CARGO_BUILD_JOBS: 2
  RUSTUP_TOOLCHAIN: nightly-2026-08-31

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # One cold build plus the complete scenario suite; per-scenario budgets
    # and the runner's non-zero exit on any failure remain unchanged.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: List E2E scenarios
        run: scripts/run_all_e2e.sh --list
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: e2e-${{ matrix.os }}
      - name: Build E2E application binaries
        run: |
          # The scenarios consume this trio. Specialized debug helpers, such as
          # layer0_render, are built by their owning scripts when exercised.
          cargo build --release --locked -p rch -p rchd -p rch-wkr --bins
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      # The runner discovers every script, records each exit code, and fails
      # this job if any scenario fails, while continuing to collect results.
      - name: Run e2e
        run: scripts/run_all_e2e.sh --out=target/e2e-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: target/e2e-artifacts/
          if-no-files-found: warn

  aggregate:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: e2e-artifacts
      - name: Aggregate
        run: |
          scripts/run_all_e2e.sh --list > expected-e2e-scripts.txt
          python3 scripts/lib/aggregate_e2e.py \
            --artifacts-dir e2e-artifacts \
            --expected-scripts expected-e2e-scripts.txt \
            --expected-os linux --expected-os macos \
            --output e2e_summary.md
          cat e2e_summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-summary
          path: e2e_summary.md
      - name: Post summary as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('e2e_summary.md', 'utf8');
            const marker = '<!-- e2e-summary -->';
            const tagged = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: tagged,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: tagged,
              });
            }
