name: e2e

# Called once by CI. Build the release applications separately from the native
# scenarios: cold release + debug + test graphs exceeded the macOS job budget.
# Both stages are required, use the same source/OS, and retain their old caps.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_BUILD_JOBS: 2
  RUSTUP_TOOLCHAIN: nightly-2026-08-31
  # Match native CI: positive cleanup tests own a complete PID/proc namespace.
  # The opt-in permits scoped sudo-unshare on hosted Ubuntu, not weaker GC.
  RCH_TEST_ALLOW_SUDO_UNSHARE: "1"

jobs:
  application:
    name: Build E2E applications (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 120
          - os: macos-latest
            timeout: 90
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      RCH_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true
          shared-key: e2e-application-${{ matrix.os }}
      - name: Build and stage unchanged native release applications
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cargo build --release --locked -p rch -p rchd -p rch-wkr --bins
          version="$(target/release/rch --version)"
          printf '%s\n' "$version"
          [[ "$version" == *"commit ${GITHUB_SHA:0:12}"* ]]
          target/release/rchd --version
          target/release/rch-wkr --version
          host="$(rustc -vV | sed -n 's/^host: //p')"
          python3 -I scripts/package_ci_components.py stage \
            --source "$GITHUB_SHA" --target "$host" --profile release \
            --output e2e-application
      - uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.os }}
          path: e2e-application/*
          if-no-files-found: error
          retention-days: 7

  run:
    needs: application
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 120
          - os: macos-latest
            timeout: 90
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: List E2E scenarios
        run: scripts/run_all_e2e.sh --list
      - name: Install native macOS shell prerequisites
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_UPGRADE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install coreutils findutils flock
          rch_test_tools="$(mktemp -d "$RUNNER_TEMP/rch-e2e-tools.XXXXXX")"
          ln -s "$(brew --prefix coreutils)/bin/gtimeout" "$rch_test_tools/timeout"
          ln -s "$(brew --prefix flock)/bin/flock" "$rch_test_tools/flock"
          "$rch_test_tools/timeout" --version
          "$rch_test_tools/flock" --version
          printf '%s\n' "$rch_test_tools" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true
          shared-key: e2e-tests-${{ matrix.os }}
      - uses: actions/download-artifact@v4
        with:
          # Only this workflow run can supply its build-stage artifact. Do not
          # accept a previous run/release when one platform did not build.
          name: application-${{ matrix.os }}
          path: e2e-application
      - name: Verify and restore exact-source E2E applications
        id: application
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          python3 -I scripts/package_ci_components.py restore-e2e \
            --source "$GITHUB_SHA" --target "$host" \
            --parts e2e-application --output target/release
          version="$(target/release/rch --version)"
          printf '%s\n' "$version"
          [[ "$version" == *"commit ${GITHUB_SHA:0:12}"* ]]
          target/release/rchd --version
          target/release/rch-wkr --version
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      - name: Verify installer and generic dispatch with the compiled client
        if: runner.os == 'Linux'
        # The fixture owns an isolated HOME/configuration; no host activation.
        run: bash scripts/install_shim_unit_test.sh "$GITHUB_WORKSPACE/target/release/rch"
      - name: Build debug support for the feature-gated Cargo harness
        if: runner.os == 'Linux'
        # The integration-test target builds its own feature-enabled CLI.
        run: cargo build --locked -p rch -p rchd -p rch-wkr --bin rchd --bin rch-wkr
      - name: Run cargo-based E2E tests (feature-gated)
        if: runner.os == 'Linux'
        env:
          RCH_MOCK_SSH: '1'
          RCH_LOG_LEVEL: debug
          RCH_E2E_SKIP_WORKER_CHECK: '1'
          RCH_TEST_LOGGING: '1'
        run: |
          set -o pipefail
          mkdir -p test-results/cargo-e2e
          cargo test --locked --features true-e2e -p rch --test true_e2e -- --test-threads=1 2>&1 | tee test-results/cargo-e2e/output.log
      - name: Run the explicit mock-SSH shell harness
        # Retain its different environment, not a second release compilation.
        if: (success() || failure()) && runner.os == 'Linux' && steps.application.outcome == 'success'
        env:
          RCH_MOCK_SSH: '1'
          RCH_LOG_LEVEL: debug
          RCH_TEST_LOGGING: '1'
          E2E_LOG_DIR: test-results/e2e-logs
          E2E_JUNIT_FILE: test-results/e2e-logs/junit.xml
        run: |
          set -o pipefail
          bash scripts/e2e_test.sh 2>&1 | tee e2e-output.log
      - name: Run every native shell E2E scenario
        # A failed Cargo fixture must not hide the shell suite. The failed step
        # still fails the job and the reusable workflow; no continue-on-error.
        if: (success() || failure()) && steps.application.outcome == 'success'
        run: scripts/run_all_e2e.sh --out=target/e2e-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: target/e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain Cargo and explicit mock-SSH logs separately
        # The native aggregator must not ingest a second environment's JSONL.
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mock-cargo-logs-${{ matrix.os }}
          path: |
            test-results/
            target/test-logs/
            e2e-output.log
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-*
          path: e2e-artifacts
      - name: Aggregate complete per-platform results
        run: |
          scripts/run_all_e2e.sh --list > expected-e2e-scripts.txt
          python3 scripts/lib/aggregate_e2e.py \
            --artifacts-dir e2e-artifacts \
            --expected-scripts expected-e2e-scripts.txt \
            --expected-os linux --expected-os macos \
            --output e2e_summary.md
          cat e2e_summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-summary
          path: e2e_summary.md
