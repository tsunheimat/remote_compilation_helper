name: Test Release

# CI calls this exact-revision packaging graph; do not also trigger a second
# independent copy for the same pull request.
on:
  workflow_call:
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR to save resources.
concurrency:
  group: test-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 2
  CARGO_BUILD_JOBS: 2
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTUP_TOOLCHAIN: nightly-2026-08-31

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            checksum_cmd: sha256sum
          - name: linux-x86_64-musl
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-musl
            checksum_cmd: sha256sum
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            checksum_cmd: sha256sum
          - name: macos-aarch64
            runs-on: macos-latest
            target: aarch64-apple-darwin
            checksum_cmd: shasum -a 256
          - name: windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runs-on }}
    # Intel's two independent profiles run below with their original flags.
    # All other platforms retain their existing complete build/packaging job.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-${{ hashFiles('Cargo.toml') }}
          shared-key: test-release-${{ matrix.target }}
          cache-on-failure: true

      # musl is a fully static target; the linker needs musl-gcc. Only the
      # musl matrix row hits this (no-op for every other target).
      - name: Install musl tools (musl targets)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # A021 split profiles: validate exactly what release.yml ships —
      # the hook CLI from wrapper-release, daemons/workers from daemon-release.
      - name: Build (A021 split profiles) (unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --profile wrapper-release --locked --target ${{ matrix.target }} -p rch
          cargo build --profile daemon-release --locked --target ${{ matrix.target }} -p rchd -p rch-wkr

      - name: Build (A021 split profiles) (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --profile wrapper-release --locked --no-default-features --target ${{ matrix.target }} -p rch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --profile daemon-release --locked --no-default-features --target ${{ matrix.target }} -p rch-wkr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify binaries exist (unix)
        if: runner.os != 'Windows'
        run: |
          test -x "target/${{ matrix.target }}/wrapper-release/rch"
          test -x "target/${{ matrix.target }}/daemon-release/rchd"
          test -x "target/${{ matrix.target }}/daemon-release/rch-wkr"

      - name: Verify binaries exist (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "target/${{ matrix.target }}/wrapper-release/rch.exe")) { throw "missing rch.exe" }
          if (!(Test-Path "target/${{ matrix.target }}/daemon-release/rch-wkr.exe")) { throw "missing rch-wkr.exe" }

      - name: Smoke test (version) (unix)
        if: runner.os != 'Windows'
        run: |
          "target/${{ matrix.target }}/wrapper-release/rch" --version
          "target/${{ matrix.target }}/daemon-release/rchd" --version
          "target/${{ matrix.target }}/daemon-release/rch-wkr" --version

      - name: Smoke test (version) (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/wrapper-release/rch.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "target/${{ matrix.target }}/daemon-release/rch-wkr.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test provisional install recovery (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --locked --target ${{ matrix.target }} -p rabs-cas --lib provisional_recovery::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          TAG="pr-${{ github.event.pull_request.number || github.run_id }}-${GITHUB_SHA:0:7}"
          mkdir -p dist
          # Flat member names (install.sh installs $TEMP_DIR/<bin>).
          tar -czf "dist/rch-${TAG}-${{ matrix.target }}.tar.gz" \
            -C "$PWD/target/${{ matrix.target }}/wrapper-release" rch \
            -C "$PWD/target/${{ matrix.target }}/daemon-release" rchd rch-wkr
          (
            cd dist
            ${{ matrix.checksum_cmd }} "rch-${TAG}-${{ matrix.target }}.tar.gz" > "rch-${TAG}-${{ matrix.target }}.tar.gz.sha256"
          )

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tag = "pr-${{ github.event.pull_request.number || github.run_id }}-$($env:GITHUB_SHA.Substring(0,7))"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $Archive = "dist/rch-$Tag-${{ matrix.target }}.zip"
          Compress-Archive -Path target/${{ matrix.target }}/wrapper-release/rch.exe,target/${{ matrix.target }}/daemon-release/rch-wkr.exe -DestinationPath $Archive
          $Hash = (Get-FileHash $Archive -Algorithm SHA256).Hash.ToLower()
          "$Hash  rch-$Tag-${{ matrix.target }}.zip" | Out-File -FilePath "$Archive.sha256" -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          retention-days: 7

  intel-profile:
    name: Build Intel macOS (${{ matrix.profile }})
    runs-on: macos-15-intel
    # The combined job exceeded 90m in run 40651533671. Keep each compiler
    # profile intact and the per-job cap at 90m, but run the independent graphs
    # on separate runners. This increases possible aggregate runner allocation;
    # it does not relax a product SLO or turn a missing profile into success.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [wrapper-release, daemon-release]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-${{ hashFiles('Cargo.toml') }}
          shared-key: test-release-x86_64-apple-darwin-${{ matrix.profile }}
          cache-on-failure: true
      - name: Build and smoke-test the unchanged shipping profile
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          if [[ "$PROFILE" == wrapper-release ]]; then
            cargo build --profile wrapper-release --locked --target x86_64-apple-darwin -p rch
            target/x86_64-apple-darwin/wrapper-release/rch --version
          elif [[ "$PROFILE" == daemon-release ]]; then
            cargo build --profile daemon-release --locked --target x86_64-apple-darwin -p rchd -p rch-wkr
            target/x86_64-apple-darwin/daemon-release/rchd --version
            target/x86_64-apple-darwin/daemon-release/rch-wkr --version
          else
            echo "Unexpected shipping profile: $PROFILE" >&2
            exit 1
          fi
      - name: Bind the component to the exact tested source and bytes
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I scripts/package_ci_components.py stage \
            --source "$GITHUB_SHA" --target x86_64-apple-darwin \
            --profile "$PROFILE" --output "component/$PROFILE"
      - uses: actions/upload-artifact@v4
        with:
          name: intel-component-${{ matrix.profile }}
          path: component/${{ matrix.profile }}/*
          if-no-files-found: error
          retention-days: 7

  intel-package:
    name: Assemble and verify Intel macOS shipping archive
    needs: intel-profile
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Both named artifacts must come from this workflow run; no cross-run or
      # latest-release download can satisfy a missing component.
      - uses: actions/download-artifact@v4
        with:
          name: intel-component-wrapper-release
          path: components/wrapper-release
      - uses: actions/download-artifact@v4
        with:
          name: intel-component-daemon-release
          path: components/daemon-release
      - name: Assemble exact-revision flat archive and verify actual packaged binaries
        shell: bash
        env:
          RUN_LABEL: ${{ github.event.pull_request.number || github.run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          TAG="pr-${RUN_LABEL}-${GITHUB_SHA:0:7}"
          python3 -I scripts/package_ci_components.py assemble \
            --source "$GITHUB_SHA" --target x86_64-apple-darwin \
            --tag "$TAG" --parts components --output dist
          (cd dist && shasum -a 256 -c *.sha256)
          unpack="$(mktemp -d "$RUNNER_TEMP/rch-intel-package.XXXXXX")"
          tar -xzf "dist/rch-${TAG}-x86_64-apple-darwin.tar.gz" -C "$unpack"
          "$unpack/rch" --version
          "$unpack/rchd" --version
          "$unpack/rch-wkr" --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify packaged artifacts
    needs: [build, intel-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Require every shipping target from the current revision
        shell: bash
        env:
          RUN_LABEL: ${{ github.event.pull_request.number || github.run_id }}
          RCH_REQUIRED_PLATFORMS: >-
            linux-x86_64|tar.gz|x86_64-unknown-linux-gnu
            linux-musl|tar.gz|x86_64-unknown-linux-musl
            linux-aarch64|tar.gz|aarch64-unknown-linux-gnu
            macos-x86_64|tar.gz|x86_64-apple-darwin
            macos-aarch64|tar.gz|aarch64-apple-darwin
            windows-x86_64|zip|x86_64-pc-windows-msvc
          RCH_OPTIONAL_PLATFORMS: ''
        run: |
          set -euo pipefail
          TAG="pr-${RUN_LABEL}-${GITHUB_SHA:0:7}"
          bash scripts/check_release_assets.sh --dir artifacts --tag "$TAG"
      - name: Verify checksums
        run: |
          cd artifacts
          sha256sum -c *.sha256
